[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-mbqc-toolkit"
version = "0.1.0"
description = "PennyLane toolkit for rotated 1D cluster states: circuits, stabilizer Hamiltonians, conditional mutual information, an MBQC gate-teleportation gadget, and a VQE solver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ziqi Xu" }]
dependencies = [
    "pennylane>=0.38",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# pennylane>=0.43: PennyLane <= 0.42 pins autoray<0.8, which conflicts with
# current quimb/cotengra. See README, "Known issue: PennyLane <= 0.42 and quimb".
tensor = ["quimb", "pennylane>=0.43"]
# jax<0.11: jax 0.11.0 removed jax.core.is_concrete, which PennyLane 0.45.1
# still calls in pennylane/math/utils.py::is_abstract. See README,
# "Known issue: jax >= 0.11".
jax = ["jax<0.11", "jaxlib<0.11"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
