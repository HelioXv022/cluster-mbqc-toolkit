name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev + jax extras)
        # The "tensor" (quimb) extra is not installed: no test needs it.
        # make_device()'s quimb error path is tested with a monkeypatch,
        # and the MPS cross-check runs in examples/01_cmi_crosscheck.py.
        run: pip install -e ".[dev,jax]"

      - name: Run tests
        run: pytest -v
